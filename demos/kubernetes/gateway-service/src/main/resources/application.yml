server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee
              uri: http://employee:8080
              predicates:
                - Path=/employee/**
              filters:
                - RewritePath=/employee/(?<path>.*), /$\{path}
            - id: department
              uri: http://department:8080
              predicates:
                - Path=/department/**
              filters:
                - RewritePath=/department/(?<path>.*), /$\{path}
            - id: organization
              uri: http://organization:8080
              predicates:
                - Path=/organization/**
              filters:
                - RewritePath=/organization/(?<path>.*), /$\{path}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"
