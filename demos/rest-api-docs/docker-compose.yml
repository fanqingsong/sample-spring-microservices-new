services:
  zipkin:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/openzipkin/zipkin
    ports:
      - "9411:9411"

  config-service:
    build:
      context: .
      target: config-service
    image: sample/config-service:1.2-SNAPSHOT
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/employee/docker"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  discovery-service:
    build:
      context: .
      target: discovery-service
    image: sample/discovery-service:1.2-SNAPSHOT
    ports:
      - "8061:8061"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8061/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  employee-service:
    build:
      context: .
      target: employee-service
    image: sample/employee-service:1.2-SNAPSHOT
    hostname: employee-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-service:
        condition: service_healthy

  department-service:
    build:
      context: .
      target: department-service
    image: sample/department-service:1.2-SNAPSHOT
    hostname: department-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-service:
        condition: service_healthy

  organization-service:
    build:
      context: .
      target: organization-service
    image: sample/organization-service:1.2-SNAPSHOT
    hostname: organization-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-service:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      target: gateway-service
    image: sample/gateway-service:1.2-SNAPSHOT
    ports:
      - "8060:8060"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-service:
        condition: service_healthy
