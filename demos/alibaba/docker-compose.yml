services:
  nacos:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  zipkin:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/openzipkin/zipkin
    ports:
      - "9411:9411"

  employee-service:
    build:
      context: .
      target: employee-service
    image: sample/alibaba-employee-service:1.2-SNAPSHOT
    hostname: employee-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      nacos:
        condition: service_healthy

  department-service:
    build:
      context: .
      target: department-service
    image: sample/alibaba-department-service:1.2-SNAPSHOT
    hostname: department-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      nacos:
        condition: service_healthy

  organization-service:
    build:
      context: .
      target: organization-service
    image: sample/alibaba-organization-service:1.2-SNAPSHOT
    hostname: organization-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      nacos:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      target: gateway-service
    image: sample/alibaba-gateway-service:1.2-SNAPSHOT
    ports:
      - "8060:8060"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      nacos:
        condition: service_healthy
